<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;font-size:14px;padding:12px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1{font-size:20px;color:#58a6ff}
h2{font-size:13px;color:#8b949e;margin:16px 0 8px;border-bottom:1px solid #21262d;padding-bottom:4px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge-live{background:#0d4429;color:#3fb950;border:1px solid #238636}
.badge-idle{background:#1c1d21;color:#8b949e;border:1px solid #30363d}
.ts{font-size:10px;color:#484f58}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px}
.card .lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:22px;font-weight:700;margin-top:2px}
.card.wide{grid-column:span 2}
.pos{color:#3fb950}.neg{color:#f85149}.neu{color:#c9d1d9}.warn{color:#d29922}

/* Positions */
.trade{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px}
.trade-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.trade-ticker{font-size:18px;font-weight:700;color:#58a6ff}
.trade-leg{font-size:10px;color:#8b949e;background:#21262d;padding:2px 8px;border-radius:10px}
.trade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.trade-item{font-size:11px}
.trade-item .t-lbl{color:#8b949e}
.trade-item .t-val{font-weight:600;font-size:13px}
.trade-pnl{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #21262d;font-weight:700;font-size:15px}

/* Watchlist */
.wl-row{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.wl-row.has-signal{border-color:#9e6a03;background:#1a1700}
.wl-top{display:flex;justify-content:space-between;align-items:center}
.wl-ticker{font-weight:700;font-size:15px}
.wl-price{color:#8b949e;font-size:12px}
.wl-signal{color:#f0e68c;font-weight:700;font-size:11px;background:#3d3100;padding:2px 8px;border-radius:10px}
.wl-conds{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.cond{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.cond-yes{background:#1a3a1a;color:#3fb950}
.cond-no{background:#1a1a1a;color:#484f58}
.cond-near{background:#2d2800;color:#d29922}
.s1-tag{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.s1-yes{background:#0d4429;color:#3fb950}
.s1-no{background:#1a1a1a;color:#484f58}

/* Last run */
.run-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;font-size:12px;margin-bottom:10px}
.run-line{display:flex;justify-content:space-between;margin:3px 0}
.run-lbl{color:#8b949e}

/* Section toggle */
.section-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.section-toggle .arrow{font-size:10px;color:#8b949e;transition:transform .2s}
.section-toggle .arrow.open{transform:rotate(90deg)}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:12px;background:#161b22;border-radius:8px;overflow:hidden;border:1px solid #30363d}
.tab{flex:1;text-align:center;padding:10px 0;font-size:12px;font-weight:600;color:#8b949e;cursor:pointer;border-right:1px solid #30363d}
.tab:last-child{border-right:none}
.tab.active{background:#21262d;color:#58a6ff}
.tab-content{display:none}
.tab-content.active{display:block}

#nodata{text-align:center;padding:60px 20px;color:#8b949e}
</style>

function switchTab(name) {
  var tabs = document.querySelectorAll('.tab');
  var contents = document.querySelectorAll('.tab-content');
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab';
  for (var i = 0; i < contents.length; i++) contents[i].className = 'tab-content';
  document.querySelector('.tab[onclick*="'+name+'"]').className = 'tab active';
  document.getElementById('tab-' + name).className = 'tab-content active';
}

function fmt$(v) {
  if (v === null || v === undefined) return '-';
  return (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

function render(data) {
  if (!data || !data.summary) return;
  document.getElementById('nodata').style.display = 'none';

  var s = data.summary;
  var badge = document.getElementById('badge');
  if (data.status === 'Live') { badge.innerText = 'LIVE'; badge.className = 'badge badge-live'; }
  else { badge.innerText = 'IDLE'; badge.className = 'badge badge-idle'; }

  document.getElementById('timestamp').innerText = data.generated ? data.generated.substring(0,16).replace('T',' ') : '';

  // Cards
  var equity = s.current_equity || 0;
  var totalPnl = s.total_pnl || 0;
  var unrealized = data.total_unrealized_pnl || 0;
  var cards = [
    {l:'Equity', v:'$'+equity.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,','), c:'neu', w:true},
    {l:'Total P&L', v:fmt$(totalPnl), c:totalPnl>=0?'pos':'neg'},
    {l:'Unrealized', v:fmt$(unrealized), c:unrealized>=0?'pos':'neg'},
    {l:'Win Rate', v:fmtPct(s.win_rate||0), c:(s.win_rate||0)>=0.5?'pos':'neg'},
    {l:'Avg R', v:(s.avg_r||0).toFixed(2)+'R', c:(s.avg_r||0)>=0?'pos':'neg'},
    {l:'Positions', v:(s.open||0)+' open / '+(s.pending||0)+' pending', c:'neu'},
    {l:'Profit Factor', v:(s.profit_factor||0).toFixed(2), c:(s.profit_factor||0)>=1?'pos':'neg'},
    {l:'Max DD', v:fmtPct(s.max_drawdown||0), c:'neg'},
  ];
  var h = '';
  for (var i = 0; i < cards.length; i++) {
    h += '<div class="card'+(cards[i].w?' wide':'')+'"><div class="lbl">'+cards[i].l+'</div><div class="val '+cards[i].c+'">'+cards[i].v+'</div></div>';
  }
  document.getElementById('cards').innerHTML = h;

  // P&L periods
  var pnlH = '';
  if (data.monthly_pnl && data.monthly_pnl.length) {
    pnlH += '<h2>Monthly P&L</h2><div class="cards" style="grid-template-columns:repeat(3,1fr);gap:4px">';
    for (var i = 0; i < data.monthly_pnl.length; i++) {
      var p = data.monthly_pnl[i];
      var c = p.pnl > 0 ? 'pos' : (p.pnl < 0 ? 'neg' : 'neu');
      pnlH += '<div class="card"><div class="lbl">'+p.period+'</div><div class="val '+c+'" style="font-size:15px">'+fmt$(p.pnl)+'</div><div style="font-size:10px;color:#8b949e">'+p.trades+'T '+fmtPct(p.win_rate)+'</div></div>';
    }
    pnlH += '</div>';
  }
  document.getElementById('pnlSection').innerHTML = pnlH;

  // Open trades
  renderOpenTrades(data.open_trades || []);

  // Pending
  var pendH = '';
  var pending = data.pending_trades || [];
  if (pending.length) {
    pendH += '<h2>Pending Orders ('+pending.length+')</h2>';
    for (var i = 0; i < pending.length; i++) {
      var t = pending[i];
      pendH += '<div class="trade">';
      pendH += '<div class="trade-header"><span class="trade-ticker">'+t.ticker+'</span><span class="trade-leg">'+legShort(t.leg_name)+'</span></div>';
      pendH += '<div class="trade-grid">';
      pendH += ti('Entry', '$'+(t.entry_price||0).toFixed(2));
      pendH += ti('Stop', '$'+(t.stop_price||0).toFixed(2));
      pendH += ti('Target', t.target_price ? '$'+t.target_price.toFixed(2) : '\u2014');
      pendH += '</div></div>';
    }
  }
  document.getElementById('pendingSection').innerHTML = pendH;

  // Closed trades
  var closed = (data.closed_trades || []).slice(-10).reverse();
  if (closed.length) {
    document.getElementById('closedHeader').style.display = 'block';
    var ch = '';
    for (var i = 0; i < closed.length; i++) {
      var t = closed[i];
      var pnlC = (t.pnl||0) >= 0 ? 'pos' : 'neg';
      ch += '<div class="trade">';
      ch += '<div class="trade-header"><span class="trade-ticker" style="font-size:15px">'+t.ticker+'</span><span class="trade-leg">'+(t.exit_reason||'?')+'</span></div>';
      ch += '<div class="trade-grid">';
      ch += ti('Entry', '$'+(t.entry_price||0).toFixed(2));
      ch += ti('Exit', '$'+(t.exit_price||0).toFixed(2));
      var durStr = t.duration_days !== null && t.duration_days !== undefined ? t.duration_days+'d' : (t.exit_date||'').substring(0,10);
      ch += ti('Held', durStr);
      ch += '</div>';
      ch += '<div class="trade-pnl"><span class="'+pnlC+'">'+fmt$(t.pnl)+'</span><span class="'+pnlC+'">'+(t.r_multiple||0).toFixed(2)+'R</span></div>';
      ch += '</div>';
    }
    document.getElementById('closedTrades').innerHTML = ch;
  }

  // Watchlist
  renderWatchlist(data.watchlist || []);

  // Elder watchlist
  if (data.elder_watchlist) renderElderWatchlist(data.elder_watchlist);

  // Last run
  renderLastRun(data.last_run);

  // Missed
  var missed = data.missed_trades || [];
  if (missed.length) {
    var mh = '';
    for (var i = 0; i < missed.length; i++) {
      var t = missed[i];
      mh += '<div class="trade" style="opacity:.6">';
      mh += '<div class="trade-header"><span class="trade-ticker" style="font-size:14px">'+t.ticker+'</span><span class="trade-leg">'+legShort(t.leg_name)+'</span></div>';
      mh += '<div style="font-size:11px;color:#8b949e">'+(t.signal_date||'').substring(0,10)+' &mdash; '+(t.notes||'expired')+'</div>';
      mh += '</div>';
    }
    document.getElementById('missedTrades').innerHTML = mh;
  }
}

function ti(label, value) {
  return '<div class="trade-item"><div class="t-lbl">'+label+'</div><div class="t-val">'+value+'</div></div>';
}

function legShort(name) {
  if (!name) return '?';
  if (name.indexOf('ema_pullback') >= 0) return 'EP';
  if (name.indexOf('shakeout') >= 0) return 'HLS';
  return name.substring(0,6);
}

function renderOpenTrades(trades) {
  var el = document.getElementById('openTrades');
  document.getElementById('openHeader').innerText = 'Open Positions (' + trades.length + ')';
  if (!trades.length) { el.innerHTML = '<div style="text-align:center;color:#484f58;padding:20px">No open positions</div>'; return; }
  var h = '';
  for (var i = 0; i < trades.length; i++) {
    var t = trades[i];
    var pnl = t.unrealized_pnl;
    var pnlC = (pnl !== null && pnl !== undefined) ? (pnl >= 0 ? 'pos' : 'neg') : 'neu';
    h += '<div class="trade">';
    h += '<div class="trade-header"><span class="trade-ticker">'+t.ticker+'</span><span class="trade-leg">'+legShort(t.leg_name)+'</span></div>';
    h += '<div class="trade-grid">';
    h += ti('Entry', '$'+(t.entry_price||0).toFixed(2));
    h += ti('Last', t.last_price ? '$'+t.last_price.toFixed(2) : '-');
    h += ti('Days', t.days_held !== null && t.days_held !== undefined ? t.days_held+'d' : '-');
    h += ti('Stop', '$'+(t.stop_price||0).toFixed(2));
    h += ti('Target', t.target_price ? '$'+t.target_price.toFixed(2) : '\u2014');
    h += ti('Qty', t.qty||'-');
    h += '</div>';
    h += '<div class="trade-pnl">';
    h += '<span class="'+pnlC+'">'+fmt$(pnl)+'</span>';
    h += '<span class="'+pnlC+'">'+(t.unrealized_r !== null && t.unrealized_r !== undefined ? t.unrealized_r.toFixed(2)+'R' : '-')+'</span>';
    h += '</div></div>';
  }
  el.innerHTML = h;
}

function condSpan(met, label) {
  return '<span class="cond '+(met?'cond-yes':'cond-no')+'">'+label+'</span>';
}

function renderWatchlist(wl) {
  var el = document.getElementById('watchlist');
  var s1Count = 0, elderCount = 0;
  for (var i = 0; i < wl.length; i++) {
    for (var j = 0; j < wl[i].legs.length; j++) {
      if (wl[i].legs[j].s1_valid) { s1Count++; break; }
    }
    if (wl[i].elder && wl[i].elder.signal_today) elderCount++;
  }
  var hdr = 'Watchlist (' + s1Count + '/' + wl.length + ' S1-valid';
  if (elderCount > 0) hdr += ', ' + elderCount + ' Elder';
  hdr += ')';
  document.getElementById('wlHeader').innerText = hdr;

  var h = '';
  for (var i = 0; i < wl.length; i++) {
    var w = wl[i];
    var s1Any = false, sigAny = false;
    var epData = null, hlsData = null;
    for (var j = 0; j < w.legs.length; j++) {
      var leg = w.legs[j];
      if (leg.s1_valid) s1Any = true;
      if (leg.signal) sigAny = true;
      var d = leg.s2_details || {};
      if (d.variant === 'ema_pullback') epData = d;
      if (d.variant === 'higher_low_shakeout') hlsData = d;
    }
    var eld = w.elder || {};
    if (eld.signal_today) sigAny = true;
    // Only show S1-valid, signal, or active positions
    if (!s1Any && !sigAny && !w.has_position) continue;

    h += '<div class="wl-row'+(sigAny?' has-signal':'')+'">';
    h += '<div class="wl-top">';
    h += '<span class="wl-ticker">'+w.ticker+(w.has_position?' *':'')+'</span>';
    h += '<span>';
    h += '<span class="s1-tag '+(s1Any?'s1-yes':'s1-no')+'">'+(s1Any?'S1':'--')+'</span> ';
    if (sigAny) h += '<span class="wl-signal">SIGNAL</span> ';
    h += '<span class="wl-price">$'+w.last_close.toFixed(2)+'</span>';
    h += '</span></div>';

    h += '<div class="wl-conds">';
    if (epData) {
      var distStr = (epData.ema_dist_pct >= 0 ? '+' : '') + epData.ema_dist_pct.toFixed(1) + '%';
      h += '<span style="font-size:10px;color:#8b949e;margin-right:2px">EP:</span>';
      h += condSpan(epData.was_above_nago, 'Above');
      h += condSpan(epData.at_ema, 'EMA '+distStr);
      h += condSpan(epData.breakout, 'Brk');
    }
    if (hlsData) {
      var ratio = hlsData.shakeout_ratio_yesterday !== undefined ? hlsData.shakeout_ratio_yesterday : 0;
      h += '<span style="font-size:10px;color:#8b949e;margin-left:6px;margin-right:2px">HLS:</span>';
      h += condSpan(hlsData.had_shakeout_yesterday, 'Shk '+ratio.toFixed(1));
      if (!hlsData.had_shakeout_yesterday && hlsData.today_is_shakeout) h += '<span class="cond cond-near">*tmrw?</span>';
      h += condSpan(hlsData.higher_low, 'HL');
      h += condSpan(hlsData.confirm_close, 'Conf');
    }
    // Elder divergence
    if (eld.has_data) {
      h += '<span style="font-size:10px;color:#8b949e;margin-left:6px;margin-right:2px">ELD:</span>';
      if (eld.signal_today) {
        h += '<span class="cond cond-yes" style="font-weight:bold">SIGNAL</span>';
      } else if (eld.potential_divergence) {
        h += condSpan(eld.regime_ok, eld.regime_ok ? 'Regime' : 'NoReg');
        h += '<span class="cond cond-near">DivForming</span>';
      } else {
        h += condSpan(eld.regime_ok, eld.regime_ok ? 'Regime' : 'NoReg');
        h += condSpan(eld.below_zero, eld.below_zero ? 'H<0' : 'H>0');
        if (eld.rising) h += '<span class="cond cond-near">Rising</span>';
      }
    }
    h += '</div></div>';
  }
  el.innerHTML = h || '<div style="text-align:center;color:#484f58;padding:20px">No watchlist data</div>';
}

function renderElderWatchlist(elderWl) {
  var hdr = document.getElementById('elderWlHeader');
  var el = document.getElementById('elderWatchlist');
  if (!elderWl || !elderWl.tickers || elderWl.tickers.length === 0) {
    hdr.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  hdr.style.display = '';
  var tickers = elderWl.tickers;
  var regOk = elderWl.regime_ok;
  var nSig = 0, nDiv = 0;
  for (var i = 0; i < tickers.length; i++) {
    if (tickers[i].signal_today) nSig++;
    if (tickers[i].div_forming) nDiv++;
  }
  var title = 'Elder (' + tickers.length + ' shortlisted';
  if (nDiv > 0) title += ', ' + nDiv + ' div';
  if (nSig > 0) title += ', ' + nSig + ' sig';
  title += ') Regime: ' + (regOk ? 'BULL' : 'OFF');
  hdr.innerText = title;

  var h = '';
  for (var i = 0; i < tickers.length; i++) {
    var t = tickers[i];
    var hasSig = t.signal_today;
    var hasDiv = t.div_forming;
    h += '<div class="wl-row'+(hasSig?' has-signal':'')+'">';
    h += '<div class="wl-top">';
    h += '<span class="wl-ticker">'+t.ticker+'</span>';
    h += '<span>';
    if (hasSig) h += '<span class="wl-signal">SIGNAL</span> ';
    else if (hasDiv) h += '<span style="color:#d29922;font-size:11px;font-weight:700;">DIV</span> ';
    h += '<span class="wl-price">$'+t.last_close.toFixed(2)+'</span>';
    h += '</span></div>';
    h += '<div class="wl-conds">';
    h += condSpan(t.below_zero, 'H<0');
    h += condSpan(t.rising, 'Rising');
    h += condSpan(t.shallower_trough, 'Shallow');
    h += condSpan(t.price_lower_low, 'PxLL');
    if (t.trough_bars_ago !== null && t.trough_bars_ago !== undefined) {
      h += '<span class="cond cond-no">'+t.trough_bars_ago+'b</span>';
    }
    if (hasSig && t.div_strength) {
      h += '<span class="cond cond-yes">'+(t.div_strength*100).toFixed(0)+'%</span>';
    }
    h += '</div></div>';
  }
  el.innerHTML = h;
}

function renderLastRun(run) {
  var el = document.getElementById('lastRun');
  if (!run) { el.innerHTML = 'No run data'; return; }
  var h = '';
  var ts = run.timestamp ? run.timestamp.substring(0,19).replace('T',' ') : '?';
  h += '<div class="run-line"><span class="run-lbl">Time</span><span>'+ts+'</span></div>';
  h += '<div class="run-line"><span class="run-lbl">Trading date</span><span>'+(run.trading_date||'?')+'</span></div>';
  h += '<div class="run-line"><span class="run-lbl">Mode</span><span>'+(run.mode||'?')+(run.ib_connected?' <span class="pos">(IB OK)</span>':'')+'</span></div>';
  if (run.equity) h += '<div class="run-line"><span class="run-lbl">Equity</span><span>$'+run.equity.toFixed(0)+'</span></div>';
  h += '<div class="run-line"><span class="run-lbl">Entries</span><span>'+(run.entries_placed>0?'<span class="warn">'+run.entries_placed+' placed</span>':(run.entries_planned>0?run.entries_planned+' planned':'<span style="color:#484f58">none</span>'))+'</span></div>';

  if (run.stop_updates && run.stop_updates.length) {
    for (var i = 0; i < run.stop_updates.length; i++) {
      var su = run.stop_updates[i];
      h += '<div class="run-line"><span class="run-lbl">Stop</span><span class="warn">'+su.ticker+' $'+su.old_stop.toFixed(2)+' &rarr; $'+su.new_stop.toFixed(2)+'</span></div>';
    }
  }

  if (run.exits_detected && run.exits_detected.length) {
    for (var i = 0; i < run.exits_detected.length; i++) {
      var ex = run.exits_detected[i];
      var c = ex.pnl >= 0 ? 'pos' : 'neg';
      h += '<div class="run-line"><span class="run-lbl">Exit</span><span class="'+c+'">'+ex.ticker+' '+ex.exit_reason+' '+fmt$(ex.pnl)+' ('+ex.r_multiple.toFixed(2)+'R)</span></div>';
    }
  }

  h += '<div class="run-line"><span class="run-lbl">Positions</span><span>'+(run.open_count||0)+' open, '+(run.pending_count||0)+' pending</span></div>';
  el.innerHTML = h;
}

// ── Init ──
function loadAndRender() {
  // Always try fetching fresh data.json (cache-busted) first
  fetch('data.json?t=' + Date.now()).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d) {
    render(d);
  }).catch(function() {
    // Fall back to embedded data or OneDrive script
    if (typeof LIVE_DATA !== 'undefined' && LIVE_DATA) {
      render(LIVE_DATA);
    } else if (DASHBOARD_DATA) {
      render(DASHBOARD_DATA);
    }
  });
}
loadAndRender();
</script>
</body>
</html>
